name: transition-benchmark
on: [push, pull_request]
permissions:
  contents: read
jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install . playwright
      - run: live2x2 assets
      - run: python -m playwright install --with-deps chromium
      - name: Compare unchanged geometry and hit-only updates
        shell: bash
        run: |
          set -euo pipefail
          CACHE="$(mktemp -d)"
          live2x2 demo --cache "$CACHE" --events 4
          live2x2 serve --cache "$CACHE" --port 8000 > benchmark-server.log 2>&1 &
          SERVER=$!
          trap 'kill "$SERVER" 2>/dev/null || true; cat benchmark-server.log' EXIT
          for attempt in {1..30}; do
            if curl -fsS http://127.0.0.1:8000/readyz; then break; fi
            sleep 1
          done
          python scripts/benchmark_transitions.py --points 20000 --repeats 4
          python scripts/benchmark_buffered.py --points 20000 --transitions 6
