name: tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e '.[worker,dev]'
      - run: pytest -q
      - run: python -m compileall -q src tests
      - run: node --check src/live2x2/static/app.js
      - run: bash -n deploy/watch.slurm
